
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipBoardSync Web</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">📋</span>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">ClipBoardSync</h1>
        </div>
        <div id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            Desconectado
        </div>
    </header>

    <main class="flex-1 p-4 max-w-lg mx-auto w-full flex flex-col gap-5">

        <!-- Card de Configuração Inicial (Exibido apenas se não configurado) -->
        <section id="config-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md flex flex-col gap-4">
            <h2 class="text-lg font-semibold text-indigo-300">Conectar Dispositivo</h2>
            <p class="text-xs text-slate-400">Informe os IDs de Usuário e Dispositivo criados no painel/API:</p>
            
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">User ID (UUID)</label>
                <input type="text" id="input-user-id" placeholder="12345678-..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Device ID (UUID)</label>
                <input type="text" id="input-device-id" placeholder="87654321-..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <button id="btn-save-config" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-indigo-600/20">
                Salvar e Conectar
            </button>
        </section>

        <!-- Card do Clipboard Recebido -->
        <section id="main-card" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Último conteúdo recebido</span>
                <span id="sender-info" class="text-xs text-indigo-400"></span>
            </div>

            <textarea id="clipboard-display" readonly rows="4" placeholder="Aguardando dados do PC ou de outros dispositivos..." 
                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm font-mono text-slate-200 resize-none focus:outline-none focus:border-indigo-500"></textarea>

            <button id="btn-copy" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition flex justify-center items-center gap-2 shadow-lg shadow-indigo-600/20">
                <span>📋</span> Copiar para este aparelho
            </button>
        </section>

        <!-- Enviar manualmente do Celular para o PC -->
        <section id="send-card" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md flex flex-col gap-3">
            <h3 class="text-sm font-medium text-slate-300">Enviar texto para os outros dispositivos</h3>
            <textarea id="send-input" rows="3" placeholder="Digite ou cole um texto aqui para enviar ao PC..." 
                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 resize-none focus:outline-none focus:border-indigo-500"></textarea>

            <button id="btn-send" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium py-2.5 rounded-xl transition flex justify-center items-center gap-2">
                <span>🚀</span> Enviar para todos
            </button>
        </section>

    </main>

    <script src="/static/app.js" type="module"></script>
</body>
</html>
